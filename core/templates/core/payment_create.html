{% extends "core/base.html" %}

{% block content %}

<div class="card">
    <h2>Record Payment</h2>
    <p>Agreement: {{ agreement.agreement_number }}</p>
</div>

<div class="card">
<form method="post">
{% csrf_token %}

<label for="payment_date">Payment Date</label><br><br>
<input type="date" name="payment_date" required style="width:100%; padding:10px;">

<br><br>

<label for="amount">Amount</label><br><br>
<input type="number" step="0.01" name="amount" required style="width:100%; padding:10px;">

<br><br>

<label for="payment_method">Payment Method</label><br><br>
<select name="payment_method" required style="width:100%; padding:10px;">
<option value="">-- Select Method --</option>
<option value="cash">Cash</option>
<option value="bank">Bank Transfer</option>
<option value="online">Online Transfer</option>
</select>

<br><br>

<label for="note">Note</label><br><br>
<input type="text" name="note" style="width:100%; padding:10px;">

<br><br>

<button type="submit" class="btn">Record Payment</button>

</form>
</div>

{% endblock %}
